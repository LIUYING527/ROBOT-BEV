# Training on preprocessed robot .npz data (see robot_data_prep in DiffusionVN).
hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra
  searchpath:
    - pkg://navsim.planning.script.config.common
  job:
    chdir: false

defaults:
  - default_common
  - default_evaluation
  - agent: diffusiondrive_robot_agent
  - _self_
  - override /train_test_split: navmini

# Set to manifest.csv paths (train and val). Val may equal train for smoke tests.
train_manifest: ???
# Optional. If null, split train_manifest into train/val automatically.
val_manifest: null
# Auto-split only used when val_manifest is null.
val_ratio: 0.1
split_seed: 0

experiment_name: robot_npz_train
output_dir: ${oc.env:NAVSIM_EXP_ROOT,./robot_exp}/robot_train

# Not used when training on robot NPZ; kept for config compatibility.
cache_path: null
use_cache_without_dataset: false
force_cache_computation: false
navsim_log_path: ""
sensor_blobs_path: ""
split: robot
train_logs: []
val_logs: []

seed: 0

dataloader:
  params:
    batch_size: 4
    num_workers: 2
    pin_memory: true
    prefetch_factor: 2

trainer:
  params:
    max_epochs: 100
    log_every_n_steps: 1
    check_val_every_n_epoch: 1
    val_check_interval: 1.0
    limit_train_batches: 1.0
    limit_val_batches: 1.0
    accelerator: auto
    strategy: auto
    precision: 16-mixed
    num_nodes: 1
    num_sanity_val_steps: 0
    fast_dev_run: false
    accumulate_grad_batches: 1
    gradient_clip_val: 0.0
    gradient_clip_algorithm: norm
    default_root_dir: ${output_dir}
